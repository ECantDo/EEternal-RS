[package]
name = "eeternal_rs"
version = "0.2.0"
edition = "2024"
authors = ["ECanDo"]
build = "build/build.rs"

[dependencies]


[features]
default = ["embed-nnue", "avx2"]
embed-nnue = []
avx2 = []
nightly = []
prefetch = []
razoring = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
#debug-assertions = true
#overflow-checks = true