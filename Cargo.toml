[package]
name = "eeternal_rs"
version = "0.3.0"
edition = "2024"
authors = ["ECanDo"]
build = "build/build.rs"

[dependencies]
viriformat = { version = "3.0.0", optional = true }

[features]
default = ["embed-nnue", "avx2"]
embed-nnue = []
avx2 = []
nightly = []
prefetch = []
razoring = []
# Self-play training data (viriformat) for the NNUE: the `datagen` UCI command
data_gen = ["dep:viriformat"]
# datagen defaults to big (1024) vs small (512) net games instead of self-play (the datagen client passes no mode)
datagen_adversarial = ["data_gen"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
#debug-assertions = true
#overflow-checks = true